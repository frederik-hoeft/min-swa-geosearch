# Included in an Nginx server {} block by both HTTP and HTTPS configurations.
# Docker's embedded resolver tracks API container replacements without Nginx restarts.
resolver 127.0.0.11 valid=30s ipv6=off;
set $api_upstream api:8080;

# Request URIs can contain device coordinates. Never log them at this ingress.
access_log off;
# Nginx upstream error messages can include the request URI (and coordinates).
error_log /dev/stderr crit;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

gzip_static on;

# Preserve URI and query parameters, including for Swagger JSON and UI assets.
location ^~ /api/ {
    include /etc/nginx/proxy.conf;
}
location = /api {
    return 404;
}
location = /swagger {
    include /etc/nginx/proxy.conf;
}
location ^~ /swagger/ {
    include /etc/nginx/proxy.conf;
}

# Blazor boot files and library static assets must return 404 when genuinely absent.
location ^~ /_framework/ {
    try_files $uri =404;
}
location ^~ /_content/ {
    try_files $uri =404;
}

# Do not cache the boot page or environment-neutral client settings across deployments.
location = /index.html {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
location = /appsettings.json {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
location ~ /\.(?!well-known) {
    deny all;
}
location ~* \.(?:js|css|json|wasm|dll|pdb|dat|ico|png|jpe?g|svg|webp|woff2?|ttf|gz|br)$ {
    try_files $uri =404;
}

# Only application navigation routes use the SPA fallback.
location / {
    try_files $uri $uri/ /index.html;
}
