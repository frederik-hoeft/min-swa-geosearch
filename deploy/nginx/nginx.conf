worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr crit;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off; # Nearby queries can include personal device coordinates.
    server_tokens off;
    sendfile on;
    gzip_static on;
    client_max_body_size 2m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker DNS keeps the upstream valid when the API container is replaced.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 8443 ssl;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        ssl_certificate /run/tls/fullchain.pem;
        ssl_certificate_key /run/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Do not use UFWeb's CSP/Permissions-Policy verbatim: GeoSearch needs
        # third-party map tiles and user-initiated browser geolocation.

        # Variable target enables DNS refresh instead of startup-only resolution.
        set $api_upstream api:8080;
        location ^~ /api/ {
            proxy_pass http://$api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location = /api { return 404; }
        location = /swagger {
            proxy_pass http://$api_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location ^~ /swagger/ {
            proxy_pass http://$api_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Missing framework assets are genuine 404s, not SPA fallbacks.
        location ^~ /_framework/ { try_files $uri =404; }
        location ^~ /_content/ { try_files $uri =404; }
        location = /index.html {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }
        location = /appsettings.json {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }
        location ~ /\. { deny all; }
        location ~* \.(?:js|css|json|wasm|dll|pdb|dat|ico|png|jpe?g|svg|webp|woff2?|ttf|gz|br)$ {
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
