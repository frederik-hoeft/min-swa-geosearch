name: geosearch-deploy

services:
  postgis:
    image: postgis/postgis:17-3.5
    # Match the lab's PostGIS version. Its upstream image is amd64-only.
    platform: linux/amd64
    environment:
      POSTGRES_DB: lab1
      POSTGRES_USER: lab1
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD:?Set POSTGIS_PASSWORD in deploy/.env}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lab1 -d lab1"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    restart: unless-stopped

  gis-tools:
    profiles: [setup]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tools
    working_dir: /workspace/lab
    # Write downloaded files as the host developer instead of creating root-owned files.
    user: "${GEOSEARCH_DATA_UID:-1000}:${GEOSEARCH_DATA_GID:-1000}"
    # Persistent local downloads; avoid downloading ~1.3 GB on each rebuild.
    volumes:
      - ../lab/data:/workspace/lab/data
    environment:
      PGHOST: postgis
      PGPORT: "5432"
      PGUSER: lab1
      PGDATABASE: lab1
      PGPASSWORD: ${POSTGIS_PASSWORD:?Set POSTGIS_PASSWORD in deploy/.env}
      GEOSEARCH_READER_PASSWORD: ${GEOSEARCH_READER_PASSWORD:?Set GEOSEARCH_READER_PASSWORD in deploy/.env}
      GEOSEARCH_DEVCONTAINER: "1"
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        BUILD_CONFIGURATION: ${DOTNET_BUILD_CONFIGURATION:-Release}
    # Optional application-specific settings. Useful during parallel auth removal;
    # the deployment infrastructure itself has no dependency on those settings.
    env_file:
      - path: .env.local
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Search: "Host=postgis;Port=5432;Database=lab1;Username=geosearch_reader;Password=${GEOSEARCH_READER_PASSWORD:?Set GEOSEARCH_READER_PASSWORD in deploy/.env}"
    expose:
      - "8080"
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        BUILD_CONFIGURATION: ${DOTNET_BUILD_CONFIGURATION:-Release}
    ports:
      - "127.0.0.1:${GEOSEARCH_HTTP_PORT:-8080}:8080"
    depends_on:
      - api
    networks:
      - backend
    restart: unless-stopped

networks:
  backend: {}

volumes:
  postgis_data: {}
