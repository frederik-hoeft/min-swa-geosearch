name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate destructive lab reset orchestration (mocked)
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Restore
        run: dotnet restore src/GeoSearch.slnx
      - name: Verify formatting
        run: dotnet format src/GeoSearch.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build src/GeoSearch.slnx --no-restore --configuration Release /p:TreatWarningsAsErrors=true
      - name: Test
        run: dotnet test src/GeoSearch.slnx --no-restore --no-build --configuration Release
