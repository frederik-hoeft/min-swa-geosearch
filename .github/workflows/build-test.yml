name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab-scripts:
    name: Lab recipes and script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Just
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y just
      - name: Parse the lab Justfile
        run: just --justfile lab/justfile --list >/dev/null
      - name: Check shell script syntax
        run: bash -n scripts/*.sh
      - name: Test lab automation without downloading datasets
        run: python3 -m unittest discover -s scripts/tests -v

  build:
    name: .NET build and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/GeoSearch.slnx
      - name: Verify formatting
        run: dotnet format src/GeoSearch.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build src/GeoSearch.slnx --no-restore --configuration Release /p:TreatWarningsAsErrors=true

  test:
    name: .NET tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/GeoSearch.slnx
      - name: Test
        run: dotnet test src/GeoSearch.slnx --no-restore --configuration Release /p:TreatWarningsAsErrors=true
