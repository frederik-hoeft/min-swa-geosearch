name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab-scripts:
    name: Lab recipes and script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Just
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y just busybox
      - name: Parse the lab Justfile
        run: just --justfile lab/justfile --list >/dev/null
      - name: Check shell script syntax
        run: bash -n scripts/*.sh
      - name: Test lab automation without downloading datasets
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test deployment automation and executable script modes
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Validate devcontainer Compose credentials
        run: |
          set -eu
          # The devcontainer requires this ignored file. A missing file must fail.
          if docker compose -f lab/compose.yaml -f .devcontainer/docker-compose.yml config --quiet 2>/dev/null; then
            echo 'Expected Compose to reject a missing .devcontainer/.env file' >&2
            exit 1
          fi
          printf '%s\n' 'GEOSEARCH_READER_PASSWORD=ci-only-placeholder-not-a-secret' > .devcontainer/.env
          trap 'rm -f .devcontainer/.env' EXIT
          docker compose -f lab/compose.yaml -f .devcontainer/docker-compose.yml config --format json |
            python3 -c 'import json, sys; config = json.load(sys.stdin); assert config["services"]["dev"]["environment"]["GEOSEARCH_READER_PASSWORD"] == "ci-only-placeholder-not-a-secret"'

  build:
    name: .NET build and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/GeoSearch.slnx
      - name: Verify formatting
        run: dotnet format src/GeoSearch.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build src/GeoSearch.slnx --no-restore --configuration Release /p:TreatWarningsAsErrors=true

  test:
    name: .NET tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/GeoSearch.slnx
      - name: Test
        run: dotnet test src/GeoSearch.slnx --no-restore --configuration Release /p:TreatWarningsAsErrors=true

  deployment:
    name: Docker image builds and Nginx configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment Compose configuration
        env:
          POSTGIS_PASSWORD: ci-only-placeholder-not-a-secret
          GEOSEARCH_READER_PASSWORD: ci-only-placeholder-not-a-secret
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Build deployment images
        run: |
          docker build -f deploy/Dockerfile.api -t geosearch-api:ci .
          docker build -f deploy/Dockerfile.web -t geosearch-web:ci .
          docker build -f deploy/Dockerfile.tools -t geosearch-tools:ci .
      - name: Verify Nginx configuration as unprivileged user
        run: |
          set -euo pipefail
          tls_dir="$(mktemp -d)"
          trap 'sudo rm -rf -- "$tls_dir"' EXIT
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$tls_dir/privkey.pem" -out "$tls_dir/fullchain.pem"
          sudo chown -R 101:101 "$tls_dir"
          sudo chmod 0700 "$tls_dir"
          sudo chmod 0600 "$tls_dir/privkey.pem" "$tls_dir/fullchain.pem"
          docker run --rm --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --mount "type=bind,source=${tls_dir},target=/run/tls,readonly" \
            --entrypoint nginx geosearch-web:ci -t
