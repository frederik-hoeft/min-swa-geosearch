name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/GeoSearch.slnx
      - name: Build
        run: dotnet build src/GeoSearch.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test src/GeoSearch.slnx --no-restore --no-build --configuration Release
